[package]
name = "rphp"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.93.1"
description = "Experimental PHP-compatible runtime implemented independently in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rphp-lang/rphp"
readme = "README.md"
keywords = ["php", "runtime", "interpreter", "vm"]
categories = ["compilers"]
publish = false

[features]
default = ["quick-loops", "jit-prototype", "stream-context"]
quick-loops = []
vm-stats = []
jit-prototype = []
coroutines = []
value-errors = []
csv-errors = ["value-errors"]
csv-write = ["csv-errors"]
resource-lifetime = []
stream-contents = ["value-errors"]
stream-copy = []
stream-context = ["value-errors"]
stream-line = ["value-errors"]
stream-registry = ["value-errors"]
stream-truncate = ["value-errors"]
php-generics-erased = []
php-generics-reified = []
file-contents = ["value-errors"]
file-write = ["value-errors"]
file-lines = ["value-errors"]
include-path = ["stream-context", "file-contents", "file-write", "file-lines"]

[dependencies]
serde = "1.0.228"
serde_json = "1.0.149"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]

# Benchmark/production ceiling build. Keep the ordinary release profile fast
# enough for day-to-day development; this profile deliberately trades build
# time for whole-program optimization.
[profile.max-perf]
inherits = "release"
lto = "fat"
codegen-units = 1
