name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and all-target check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unsafe policy self-test
        run: scripts/test-unsafe-policy.sh
      - name: Unsafe policy ratchet
        if: github.event_name == 'pull_request'
        env:
          RPHP_UNSAFE_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-unsafe-policy.sh --diff-base "${RPHP_UNSAFE_DIFF_BASE}"
      - name: Unsafe policy inventory
        if: github.event_name != 'pull_request'
        run: scripts/check-unsafe-policy.sh
      - name: All features and targets
        run: cargo check --locked --all-features --all-targets

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default + Linux x86-64 JIT
            command: cargo test --locked
          - name: no default features
            command: cargo test --locked --no-default-features
          - name: erased generics
            command: cargo test --locked --features php-generics-erased
          - name: reified generics
            command: cargo test --locked --features php-generics-reified
          - name: all features
            command: cargo test --locked --all-features
    steps:
      - uses: actions/checkout@v5
      - name: Run test configuration
        run: ${{ matrix.command }}

  composer-s0:
    name: Composer S0 autoload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run pinned Composer autoload gate
        run: scripts/test-composer-s0.sh

  symfony-event-dispatcher-s1:
    name: Symfony EventDispatcher S1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run pinned Symfony EventDispatcher gate
        run: scripts/test-symfony-event-dispatcher-s1.sh

  symfony-http-foundation-s1:
    name: Symfony HttpFoundation S1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run pinned Symfony HttpFoundation gate
        run: scripts/test-symfony-http-foundation-s1.sh

  symfony-routing-s1:
    name: Symfony Routing S1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run pinned Symfony Routing gate
        run: scripts/test-symfony-routing-s1.sh

  symfony-dependency-injection-s1:
    name: Symfony DependencyInjection S1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run pinned Symfony DependencyInjection gate
        run: scripts/test-symfony-dependency-injection-s1.sh

  symfony-warmed-kernel-s2:
    name: Symfony warmed kernel S2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run pinned Symfony warmed-kernel gate
        run: scripts/test-symfony-warmed-kernel-s2.sh
